name: Import Claude ZIP into repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project ZIP and replace repository files
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="glass-launcher.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Upload glass-launcher.zip to the repository root first."
            exit 1
          fi

          mkdir -p /tmp/launcher-import
          unzip -q "$ZIP_PATH" -d /tmp/launcher-import

          if [ -d /tmp/launcher-import/glass-launcher ]; then
            SRC="/tmp/launcher-import/glass-launcher"
          else
            SRC="/tmp/launcher-import"
          fi

          # Preserve this importer workflow so the process can be repeated.
          mkdir -p /tmp/preserve-workflow
          cp .github/workflows/import-zip.yml /tmp/preserve-workflow/import-zip.yml

          # Remove tracked files, then copy the ZIP project to the repository root.
          git ls-files -z | xargs -0 -r git rm -f
          cp -a "$SRC"/. .
          mkdir -p .github/workflows
          cp /tmp/preserve-workflow/import-zip.yml .github/workflows/import-zip.yml
          rm -f glass-launcher.zip

          # Ensure the Gradle wrapper can run on Linux.
          chmod +x gradlew

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import Claude glass launcher project"
          git push