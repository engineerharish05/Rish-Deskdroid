name: Import project ZIP into repository

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project ZIP and replace repository files
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="rish-deskdroid.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Upload rish-deskdroid.zip to the repository root first."
            exit 1
          fi

          mkdir -p /tmp/launcher-import
          unzip -q "$ZIP_PATH" -d /tmp/launcher-import

          SRC="/tmp/launcher-import"
          FIRST_LEVEL_COUNT="$(find /tmp/launcher-import -mindepth 1 -maxdepth 1 | wc -l)"
          if [ "$FIRST_LEVEL_COUNT" -eq 1 ] && [ -d "$(find /tmp/launcher-import -mindepth 1 -maxdepth 1 -type d | head -n 1)" ]; then
            SRC="$(find /tmp/launcher-import -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi

          mkdir -p /tmp/preserve-workflow
          cp .github/workflows/import-zip.yml /tmp/preserve-workflow/import-zip.yml

          git ls-files -z | xargs -0 -r git rm -f
          cp -a "$SRC"/. .
          rm -f .github/workflows/build.yml
          mkdir -p .github/workflows
          cp /tmp/preserve-workflow/import-zip.yml .github/workflows/import-zip.yml
          rm -f rish-deskdroid.zip

          if [ -f gradlew ]; then chmod +x gradlew; fi
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import Rish Deskdroid project"
          git push